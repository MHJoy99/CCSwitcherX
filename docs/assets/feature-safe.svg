<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Encrypted saved logins with backups and rollback</title>
<desc>A padlock snaps shut, and a circular undo arrow appears beside it. Saved logins are encrypted with Windows DPAPI and backed up before every switch.</desc>
<style>
.h{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;fill:#f0eee6}
.d{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;fill:#a3a099}
.shk{transform:translateY(0);animation:shk 7s ease-out infinite}
.body{transform-box:fill-box;transform-origin:center;animation:body 7s ease-out infinite}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 7s ease-out infinite}
.undoG{opacity:.35;animation:undo 7s ease-in-out infinite}
.undoI{transform-box:fill-box;transform-origin:center;animation:undoI 7s ease-in-out infinite}
@keyframes shk{0%,16%{transform:translateY(-14px)}26%,88%{transform:translateY(0)}96%,100%{transform:translateY(-14px)}}
@keyframes body{0%,24%{transform:scale(1)}28%{transform:scale(.95)}34%,100%{transform:scale(1)}}
@keyframes ring{0%,25%{transform:scale(.9);opacity:0}26%{opacity:.9}42%,100%{transform:scale(1.3);opacity:0}}
@keyframes undo{0%,36%{opacity:.35}50%,88%{opacity:1}96%,100%{opacity:.35}}
@keyframes undoI{0%,36%{transform:rotate(0deg)}50%{transform:rotate(-40deg)}62%,100%{transform:rotate(0deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="478" height="298" rx="18" fill="#2a2927" stroke="#3b3936" stroke-width="2"/>
<rect x="28" y="32" width="424" height="132" rx="14" fill="#1f1e1d"/>
<circle class="ring" cx="196" cy="122" r="30" fill="none" stroke="#d97757" stroke-width="2"/>
<path class="shk" d="M176 100V84a20 20 0 0 1 40 0V100" fill="none" stroke="#f0eee6" stroke-width="7"/>
<rect class="body" x="168" y="100" width="56" height="44" rx="9" fill="#d97757"/>
<circle cx="196" cy="117" r="5" fill="#2a2927"/>
<rect x="194" y="117" width="4" height="11" rx="2" fill="#2a2927"/>
<g class="undoG">
  <g transform="translate(300 122) scale(1.2) translate(-12 -12)" fill="none" stroke="#f0eee6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <g class="undoI">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </g>
  </g>
</g>
<text class="h" x="28" y="206">Encrypted and recoverable</text>
<text class="d" x="28" y="232">Windows DPAPI, backups before every switch,</text>
<text class="d" x="28" y="252">crash recovery and rollback.</text>
</svg>
