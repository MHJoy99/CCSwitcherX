<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>CCSwitcherX logo, animated</title>
  <desc>Two white arrows on a terracotta rounded square. Every 6 seconds the arrows swap places and settle back.</desc>
  <style>
    .top, .bot { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    .top { animation-name: swapTop; }
    .bot { animation-name: swapBot; }
    @keyframes swapTop {
      0%, 33% { transform: translateY(0); }
      50%, 67% { transform: translateY(64px); }
      83%, 100% { transform: translateY(0); }
    }
    @keyframes swapBot {
      0%, 33% { transform: translateY(0); }
      50%, 67% { transform: translateY(-64px); }
      83%, 100% { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
  <rect x="10.24" y="10.24" width="235.52" height="235.52" rx="61.44" fill="#d97757"/>
  <g class="top">
    <rect x="56.32" y="85.76" width="102.4" height="20.48" rx="10.24" fill="#ffffff"/>
    <polygon points="143.36,56.32 204.8,96 143.36,135.68" fill="#ffffff"/>
  </g>
  <g class="bot">
    <rect x="97.28" y="149.76" width="102.4" height="20.48" rx="10.24" fill="#ffffff"/>
    <polygon points="112.64,120.32 51.2,160 112.64,199.68" fill="#ffffff"/>
  </g>
</svg>
